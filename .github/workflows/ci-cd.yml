name: CI/CD Pipeline & Live Deployment — Sistema Personal Trainer

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  validate-and-build:
    name: Test, TypeCheck & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repositório
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Instalar Dependências
        run: npm install

      - name: Validação Estrita de Tipos (TypeScript)
        run: npm run type-check

      - name: Execução de Testes Automatizados
        run: npm test

      - name: Build Otimizada para Produção
        run: npm run build

      - name: Deploy para o branch gh-pages (Deploy Universal)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload de Artefatos para Deploy
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    name: Publicar Acesso Remoto (Live Web App)
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: validate-and-build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
